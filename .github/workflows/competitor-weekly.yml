name: Competitor Blog Tracker

on:
  schedule:
    - cron: '30 3 * * 1'   # every Monday 09:00 IST
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Crawl competitor sitemaps
        run: python3 competitors/track.py
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitors/data.json competitors/history.json
          git diff --staged --quiet || git commit -m "chore: competitor blog data $(date +'%Y-%m-%d')"
          git push
