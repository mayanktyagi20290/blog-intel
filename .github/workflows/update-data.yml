name: Update Blog Data Daily

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest blog data
        run: python fetch_data.py

      - name: Update HTML with new data
        run: python inject_data.py

      - name: Commit and push if data changed
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "Blog Intel Bot"
          git add data/naukri.json data/internshala.json index.html
          git diff --staged --quiet || git commit -m "Auto-update: $(date +'%Y-%m-%d') blog data refresh"
          git push
