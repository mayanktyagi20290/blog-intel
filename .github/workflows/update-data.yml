name: Update Blog Intel Data Daily

on:
  schedule:
    - cron: '0 3 * * *'   # 8:30 AM IST = 03:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 deprecation warning

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch all RSS feeds & inject into index.html
        run: python3 fetch_and_inject.py

      - name: Commit updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: auto-update blog data $(date +'%Y-%m-%d')"
          git push
